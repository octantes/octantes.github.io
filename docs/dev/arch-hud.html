        <h1>arch-hud</h1>
        <div class="meta">14/09/2025 // kaste</div>
      </header>
      
      <p><em>You can find the project repo in my <a href="https://github.com/octantes/arch-hud">Github</a></em></p>
<p>arch-hud is a personal build of <a href="https://suckless.org/">suckless</a> tools for daily use on arch</p>
<p>the tools were implemented thinking of building a <em>heads up display</em><br />aiming to make the computer a tool again instead of a cognitive black hole<br />several DWM patches were implemented along with a retro-style aesthetic<br />no gaps, no transparency, no compositor by default; <strong>no unnecessary distractions</strong></p>
<p><img src="/posts/desarrollo/arch-hud/screenshot.webp" width="600" height="338" loading="lazy" alt="screenshot"></p>
<p>to compile, enter each dir and run <em>sudo make clean install</em> or use build.sh</p>
<p><a href="https://dwm.suckless.org/">dwm</a> - tiling windows manager<br /><a href="https://tools.suckless.org/dmenu/">dmenu</a> - dynamic script menu<br /><a href="https://st.suckless.org/">st</a> - simple terminal emulator<br /><a href="https://surf.suckless.org/">surf</a> - very minimal browser<br /><a href="https://tools.suckless.org/tabbed/">tabbed</a> - window tabbing for st and surf<br /><a href="https://github.com/dunst-project/dunst">dunst</a> - notification daemon</p>
<p>you can add the <a href="https://github.com/yshui/picom">picom</a> compositor if you experience screen tearing or glitches</p>
