        <h1>scav - substrate for a portable web</h1>
        <div class="meta">15/09/2026 // kaste</div>
      </header>
      
      <div class="nota-prosa"><hr>
<p><em>You can find the project repo in my <a href="https://github.com/octantes/scavenger" target="_blank" rel="noopener noreferrer">Github</a></em></p>
<hr>
<pre><code>&gt; Harvest anything from the web and wire it into something new
&gt; Export it as a single html file, use it anywhere and publish it
&gt; UI is a function of state, and in s&lt;av&gt; state is a function of DOM
</code></pre>
<p><video src="/posts/desarrollo/scavenger/loop.mp4" poster="/posts/desarrollo/scavenger/loop-poster.jpg" width="720" height="404" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="loop"></video></p>
<p><strong>scavenger is a substrate for portable web tools.</strong> Anything you build with scav becomes portable by definition, exporting into a single, standalone HTML file that works anywhere. No packages, no build step, no framework, no account, and <em>nothing phoning home</em> unless you explicitly want it to.</p>
<p>The toolkit has four core primitives, deliberately different in shape because each is the natural form for what it does. <strong>You don't need all of them to build something</strong>, but together they form the complete project.</p>
<h3>The Four Tools</h3>
<p><a href="https://github.com/octantes/scavenger/blob/main/docs/kernel.md" target="_blank" rel="noopener noreferrer">kernel</a></p>
<p>The script that you run on any website to harvest components, lift data and run visual debugging tools.</p>
<p><video src="/posts/desarrollo/scavenger/harvest.mp4" poster="/posts/desarrollo/scavenger/harvest-poster.jpg" width="720" height="404" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="harvest"></video></p>
<p>Harvesting is not scraping HTML or taking a screenshot. It <strong>takes a rendered component from a live page and reconstructs it</strong> as an independent Web Component: resolving the styles the browser actually applied, preserving the cascade, responsive units, variables, pseudo-elements, fonts, assets, form state, and relevant layout behavior.</p>
<p><a href="https://github.com/octantes/scavenger/blob/main/docs/patchbay.md" target="_blank" rel="noopener noreferrer">patchbay</a></p>
<p>The runtime, where you place components and wire them, exporting the project as-is into HTML.</p>
<p><video src="/posts/desarrollo/scavenger/wiring.mp4" poster="/posts/desarrollo/scavenger/wiring-poster.jpg" width="720" height="404" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="wiring"></video></p>
<p><a href="https://github.com/octantes/scavenger/blob/main/docs/quests.md" target="_blank" rel="noopener noreferrer">quests</a></p>
<p>The bridge to live external state and data, turning CSS selectors into channels for patchbay to consume.</p>
<p><video src="/posts/desarrollo/scavenger/quests.mp4" poster="/posts/desarrollo/scavenger/quests-poster.jpg" width="720" height="404" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="quests"></video></p>
<p><a href="https://github.com/octantes/scavenger/blob/main/docs/compiler.md" target="_blank" rel="noopener noreferrer">compiler</a></p>
<p>The authoring environment, where you create new logic nodes and components that extend patchbay.</p>
<p><video src="/posts/desarrollo/scavenger/component.mp4" poster="/posts/desarrollo/scavenger/component-poster.jpg" width="720" height="404" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="component"></video></p>
<h2>Philosophy</h2>
<p>This project starts from a simple premise: <strong>the browser already is a malleable computational substrate.</strong></p>
<p>The Document Object Model is not just the representation of an interface; it is a live, addressable state space that the browser knows how to render, mutate, serialize, persist and rehydrate. This leads to a simple model: UI is a function of state, and all <strong>persistent state is a function of the DOM.</strong></p>
<pre><code>htmx says
&quot;don't maintain a second client-side representation of UI
HTML is the representation&quot;

scav says
&quot;don't maintain a second representation of the application
the DOM holds the state&quot;
</code></pre>
<p>The consequence of this conceptualization is that <strong>the document isn't a rendering of the app, the app is a rehydration of the document.</strong> If state lives in element attributes, values can be serialized into markup, and if the runtime reads the document itself, there is no hidden model to drift out of sync. Saving is a memory dump, the file just boots.</p>
<p>The same property that makes state serialization possible also makes the runtime web <strong>a material you can build from</strong>. The early web itself was built around documents that could be linked, copied, saved, edited and served without asking permission from a platform.</p>
<p>This is still true. The underlying model hasn't changed, but <em>layers of tooling and growing complexity have obscured it.</em> We stopped noticing - scav makes those properties apparent and directly usable. What gets distributed to your machine is yours to harvest, rewire and repurpose, and what you build with it can persist as a document.</p>
<p>The modern browser is the closest working approximation of the conceptual model The Memex imagined, Engelbart demoed, and Nelson spent a lifetime writing about: hypertext you author, not just consume. scavenger is less of an invention than a realization that the model is <strong>already here</strong>, installed on almost every personal computer.</p>
<p>The long argument lives in a companion essay - <em>Artesanías del Runtime</em> - on the browser as a scavengeable runtime and <strong>the third domain</strong> of tools that only exist there: not CLI, not web app, but local-first visual runtime. (Forthcoming.)</p>
