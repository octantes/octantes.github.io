        <h1>browsewithscroll</h1>
        <div class="meta">05/03/2026 // kaste</div>
      </header>
      
      <p><em>You can find the project repo in my <a href="https://github.com/octantes/browsewithscroll">Github</a></em></p>
<p>scroll is a local tool to <strong>preview font and multimedia collections</strong><br />no installation or internet needed: just clone the repo and run the &quot;launch.sh&quot; script</p>
<p>built for designers and creators who need a fast way to browse resources<br />ideal for those seeking simplicity and privacy: not meant for complex workflows<br />however, being so lightweight, it handles huge directories without issues</p>
<p>all information stays on your machine, no accounts, servers or syncs<br />the tool <em>bypasses CORS by using scripts</em> to &quot;bake&quot; the file list</p>
<p><video src="/posts/desarrollo/browsewithscroll/preview.mp4" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="screenshot"></video></p>
<p>each release is stable, the goal is to keep it <strong>simple</strong>: open it and scroll</p>
<p><em>zero dependencies</em>: no libraries, scripts use only standard unix tools<br /><em>font-viewer</em>: preview .ttf, .otf and .woff files with lorem ipsum rendering<br /><em>multimedia</em>: support for common image formats and videos (mp4, webm, ogg)<br /><em>launch and sync</em>: the launch.sh script updates the asset list and opens scroll<br /><em>shuffle mode</em>: explore your collection randomly or in sequential order<br /><em>serverless</em>: works directly via file:// protocol without using servers<br /><em>hyperlight</em>: minimal overhead to maintain fluidity with thousands of files</p>
<p><strong>wip</strong>: grid mode &gt; customizable text &gt; basic metadata display &gt; tagging system</p>
<p>remember new files <strong>won't show until you run the launcher again!</strong></p>
<p>pro-tip: <em>save it as a bookmark for quick access</em></p>
