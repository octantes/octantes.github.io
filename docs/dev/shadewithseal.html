        <h1>shadewithseal</h1>
        <div class="meta">03/07/2025 // kaste</div>
      </header>
      
      <p><em>You can find the project repo in my <a href="https://github.com/octantes/shadewithseal">Github</a></em></p>
<p>seal is a local tool to <strong>create, save and record glsl frag shaders</strong><br />no installation or internet needed: just download the HTML and open it in your browser</p>
<p>built for technical artists who want a lightweight playground to prototype<br />ideal for those seeking simplicity and privacy: not meant for professional use<br />however, some important edge-cases are covered to ensure practicality</p>
<p>all information stays on your machine, no accounts, servers or syncs<br />the data <em>stays in your browser until you export it</em> — make regular backups</p>
<p><img src="/posts/desarrollo/shadewithseal/screenshot.webp" width="600" height="295" loading="lazy" alt="screenshot"></p>
<p>each release is stable, the goal is to keep it <strong>simple</strong>: open it and code</p>
<p><em>live-coding</em>: program GLSL shaders while seeing results in real time<br /><em>rendering</em>: simple and minimal render-loop based on webGL (currently 1.0 only)<br /><em>compatibility</em>: most of shadertoy's custom variables have been implemented<br /><em>recording</em>: functions to record, play, pause and download the video to webm<br /><em>storage</em>: everything is saved inside the browser cache using indexedDB<br /><em>super lightweight</em>: compatible with any browser, including mobile; only ~100 KB</p>
<p><strong>wip</strong>: webGL2 &gt; JSON export &gt; canvas overlay + blending modes &gt; aspect ratios</p>
<p>pro-tip: <em>save it as a bookmark for quick access</em></p>
