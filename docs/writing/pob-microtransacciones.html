        <h1>microtransactions and their future</h1>
        <div class="meta">13/12/2021 // kaste</div>
      </header>
      
      <div class="nota-prosa"><p><em>This note was originally written for and published in <a href="https://pressover.news/articulos/las-microtransacciones-y-su-futuro/">Press Over</a></em></p>
<p>Many of us avoid them at all costs, others consider them a fundamental part of their gaming experience. While the debate over microtransactions is <em>rife with controversy</em>, the reality is that they belong to most of the worlds we inhabit daily, and as such, it's important to think about them going forward. To do this, we must first define them.</p>
<p>Basically, microtransactions consist of the <strong>purchase of digital goods through online payments</strong>. The offering is very broad and depends on the game, but we can separate them into two categories based on their function: cosmetic and functional.</p>
<h3>Cosmetic Goods</h3>
<p>Within this category are items that do not significantly affect gameplay. In most cases, their goal is to <em>change the aesthetics</em>, whether through skins for characters or weapons, dances, interactions, or visual alterations to the map.</p>
<p><img src="/posts/textos/pob-microtransacciones/microtransacciones-1.webp" width="600" height="627" loading="lazy" alt="Fortnite skins are a good example of cosmetic goods."></p>
<p>The motivation to acquire this type of effect varies greatly, but usually centers on <em>the player's emotional attachment to the characters and world presented by each work</em>. Although they are better regarded than functional ones, monetizing an aspect so close to feelings often leads to abuse of marketing and psychology to incentivize users to buy things they don't want.</p>
<h3>Functional Goods</h3>
<p>This category includes experience boosts, characters or weapons that can only be obtained by paying, exclusive maps, extra lives, and any type of item that gives buyers an advantage within the system.</p>
<p>Functional goods are often criticized for the <strong>lack of fairness they generate in the community</strong>, especially when the benefits directly affect player versus player encounters, diminishing the value of experience, training, and knowledge. The creation of terms like &quot;pay to win&quot; reflects the disdain many feel for the implementation of these practices.</p>
<p>Other items fall outside these categories, such as lootboxes, which offer random rewards when opened, or season passes, which allow unlocking them by leveling up.</p>
<h3>Why do microtransactions exist?</h3>
<p>Behind every title we consume, there is a team that dedicated their time and inevitably their financial resources to develop it. It may sound obvious, but there is a tendency to forget that the reason we can enjoy such a diverse medium is because there is a business model that <strong>creates jobs and motivates investments</strong> responding to buyer demand.</p>
<p><img src="/posts/textos/pob-microtransacciones/microtransacciones-2.webp" width="600" height="377" loading="lazy" alt="The highest grossing free-to-play games in 2020. Note that practically all are mobile games."></p>
<p>With so much passion involved, this is a somewhat frivolous way to understand the industry, but at the end of the day, those teams have to eat. Let's be clear: despite the need for an economic system, we must never stop criticizing its operation. <em>The number of failures, abuses, and potential threats to both developers and consumers is inexcusable</em>, and the only way to combat them is by talking, debating, and forming our stance.</p>
<h3>The role of microtransactions in the market</h3>
<p>Within the established business model, microtransactions are the backbone on which a large percentage of the industry subsists, especially when we talk about free-to-play titles and games as a service. Currently, many companies choose the <em>freemium format</em> to reach more people and generate more long-term revenue. In other cases, the same idea is applied to paid products, leveraging a solid player base that is willing to both buy the title and pay for exclusive items.</p>
<p><img src="/posts/textos/pob-microtransacciones/microtransacciones-3.webp" width="600" height="482" loading="lazy" alt="Microtransaction sales on mobile nearly double those on console."></p>
<p>Recently, a process of legislative regulation has begun to protect consumers, triggering studies that question the ethics of these practices, especially when the target audience is minors. The results show that the use of <strong>visual effects, animations, and sounds activate a chemical response in the brain very similar to gambling</strong>, making them addictive. Several countries have already regulated or completely eliminated microtransactions, but there are still no global regulations.</p>
<h3>The Future Market</h3>
<p>Now that we understand the basics, we can move on to something a bit more complex: asking where this model is headed. While I don't intend to do futurology, analyzing some growing systems allows us to consider several possibilities.</p>
<p>One of the latest trends in video game monetization comes from blockchain, a technology that, among other things, serves to <em>decentralize digital elements, making them unique and unreproducible</em>. When released to the market, these virtual objects called NFTs (non-fungible tokens) acquire their own value that responds to cultural and temporal variables outside the control of the company or person responsible for their creation.</p>
<h3>How do they apply to microtransactions?</h3>
<p>The explosion of NFTs has been heavily criticized for its environmental impact, but some of the concepts they are based on have been in gaming for several years. For example, in the Counter Strike market, each skin is unique. <strong>Two people can buy the same item, but they will have subtle differences</strong>, such as wear marks in random places that can increase or decrease its value. The reason we can't consider them NFTs is because they don't operate on a blockchain, but on Steam's centralized market.</p>
<p><img src="/posts/textos/pob-microtransacciones/microtransacciones-4.webp" width="600" height="664" loading="lazy" alt="Although limited, the tools CS:GO"></p>
<p>Most crypto games exploring these options present them as their main novelty, but it's expected that over time and seeing the results of current experiments, <em>they will be integrated into more diverse products</em>.</p>
<p>If we've learned anything in these years, it's that there's no shortage of ingenuity to integrate any system that generates numbers, as happened with battle passes. Let's hope that, whatever happens, conditions improve for everyone, and remember that the more informed we are, the harder it will be to deceive us.</p>
