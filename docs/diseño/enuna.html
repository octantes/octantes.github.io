<p>este fue mi primer <em>proyecto</em> de diseño, después de años sin profundizar mucho<br />se me ocurrió pensar conceptos de marcas ficticias, como excusa para practicar</p>
<p>en este caso, el objetivo era diseñar assets y <strong>animarlos</strong> usando after effects<br />para eso, la excusa fue una revista de publicación digital con muy pocos colores<br />hoy en día le veo problemas de espaciado, y el texto del copy me parece básico<br />me gustaría revisitar esta <em>estética</em> con algún proyecto real que la aproveche</p>
<p>el trabajo fue realizado usando figma, photoshop y after effects, entre otros</p>
