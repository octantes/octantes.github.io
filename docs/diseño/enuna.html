<img src="/posts/diseño/enuna/credits.webp" width="600" height="235" loading="lazy" alt="créditos del proyecto"><div class="nota nota-prosa"><p><em><strong>en una</strong></em> es una revista digital moldeada por la calle y el internet.</p>
<p>A medida que la publicación pasó de editar fanzines a ser una plataforma multimedia, necesitaba una identidad que pudiera cargar ambos mundos sin reducir ninguno.</p>
<p><img src="/posts/diseño/enuna/process-board.webp" width="600" height="335" loading="lazy" alt="Tablero"></p>
<p>Construí un sistema visual alrededor de elementos reconocibles y flexibles que pudieran desplazarse entre el sitio web, contenido editorial, animaciones y posts. Cada pieza necesitaba sostener la misma identidad, dejando espacio para juego, evolución y nuevos formatos.</p>
<p>El resultado se aleja de las estéticas de medios tradicionales y mantiene viva la energía áspera y hazlo tú mismo de la publicación original. Tipografía, textura, composición y animación trabajan juntos para que el sistema se sienta vivo.</p>
<h3>Página</h3>
<p>El sitio debía funcionar como una pizarra a medida que el equipo encontraba su voz online: un lugar para testear ideas, cambiar dirección y seguir evolucionando sin reconstruir todo el sistema.</p>
<p>El video vertical se estaba volviendo central al output de la revista, así que el sitio tenía que hacer que ese formato se sintiera nativo. Construimos un sistema flexible que trae los embeds verticales de YouTube a la página, donde se reproducen en hover y conviven con el trabajo escrito y visual de la revista.</p>
<p>El resultado combina la plataforma y su output externo en una única experiencia continua.</p>
<p><img src="/posts/diseño/enuna/webpage.webp" width="600" height="1157" loading="lazy" alt="Página"></p>
