<p>cruzar fue mi <em>segundo</em> proyecto de diseño sobre identidades de marca ficticias<br />el objetivo era armarme una excusa para animar y practicar varias herramientas</p>
<p>en este caso, el concepto se apoderó totalmente del proyecto, creo que para bien<br />poner un <strong>datacenter</strong> en la cordillera es una idea latente en nuestro imaginario<br />la pata cripto es parte de un mismo objetivo, hacer buen uso de nuestro entorno<br />siento que solo es cuestión de tiempo, y ojalá que sea un proyecto <em>argentino</em></p>
<p>por las limitaciones de la página, es muy posible que los gifs se desincronicen</p>
<p>proyecto realizado usando figma, photoshop y after effects, entre otras cosas</p>
