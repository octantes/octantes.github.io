      <video src="/posts/diseño/cruzar/banner.mp4" poster="/posts/diseño/cruzar/banner-poster.jpg" width="488" height="274" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="header del proyecto"></video>
<video src="/posts/diseño/cruzar/fundamentos.mp4" poster="/posts/diseño/cruzar/fundamentos-poster.jpg" width="488" height="174" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="fundamentos de la marca"></video>
<video src="/posts/diseño/cruzar/topografico.mp4" poster="/posts/diseño/cruzar/topografico-poster.jpg" width="488" height="140" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="terreno y topografía"></video>
<video src="/posts/diseño/cruzar/servicios.mp4" poster="/posts/diseño/cruzar/servicios-poster.jpg" width="488" height="140" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="paquetes de servicio"></video>
<video src="/posts/diseño/cruzar/footer.mp4" poster="/posts/diseño/cruzar/footer-poster.jpg" width="488" height="294" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="presentación final"></video><div class="nota nota-prosa"><p><em><strong>CRUZAR</strong></em> es un proyecto que está construyendo dos centros de datos en la cordillera patagónica, diseñados para soportar computación accesible de alto rendimiento, infraestructura de minería cripto y entrenamiento de modelos de inteligencia artificial.</p>
<p>La identidad tenía que conectar la escala física del paisaje con la maquinaria interna: cadenas montañosas, imágenes satelitales, racks de servidores, cables y el movimiento constante de datos. Había que lograr que se sintiera arraigada en Argentina, hablando el lenguaje nativo de la infraestructura contemporánea.</p>
<p><img src="/posts/diseño/cruzar/process-board.webp" width="600" height="310" loading="lazy" alt="Tablero"></p>
<p>Más allá de las instalaciones, <em>CRUZAR</em> se construye alrededor de una idea más amplia de soberanía computacional. El proyecto busca dar a constructores jóvenes acceso a compute local para su propio trabajo, fomentar la experimentación técnica en Argentina, y multiplicar valor reinvirtiendo ganancias en la infraestructura usada para minería y el almacenamiento de Bitcoin.</p>
<h3>Bocetos</h3>
<p>El punto de partida no fue un lienzo en blanco. Un boceto sin usar para una marca de ropa ya contenía varios componentes que <em>CRUZAR</em> necesitaba: terreno, textura y un lenguaje gráfico con suficiente movimiento para volverse un sistema.</p>
<p><img src="/posts/diseño/cruzar/previous-sketches.webp" width="600" height="338" loading="lazy" alt="Bocetos"></p>
<p>El trabajo fue un ejercicio de selección: mantuve los elementos que podían cargar el nuevo proyecto, eliminé los atados a la dirección original, e introduje nuevas herramientas para conectar la identidad con infraestructura de datos.</p>
<h3>Mapa</h3>
<p>La imaginería satelital necesitaba ser una parte viva de la identidad visual, no un asset fijo. Armé un sistema propio conectado a la API de Google Earth que exporta automáticamente animaciones procesadas listas para usar en todo el proyecto.</p>
<p><video src="/posts/diseño/cruzar/topografico.mp4" poster="/posts/diseño/cruzar/topografico-poster.jpg" width="488" height="140" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Asset"></video></p>
<p>El sistema corre en un servidor local con herramientas personalizadas, soporta actualizaciones por coordenadas y genera identity cards exportables como assets estáticos o animaciones listas para usar.</p>
<p><video src="/posts/diseño/cruzar/ge-system.mp4" poster="/posts/diseño/cruzar/ge-system-poster.jpg" width="800" height="450" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Google Earth"></video></p>
<h3>Paquetes</h3>
<p><em>CRUZAR</em> necesitaba diferentes niveles para cubrir las necesidades de distintos constructores, desde un primer setup de computación/minería hasta infraestructura totalmente configurable. Cada tier necesitaba separación visual clara pero pertenecer al mismo sistema.</p>
<p>Basé los íconos en animales nativos, volviendo cada uno un objeto 3D rotativo con aspecto de ítem de videojuego. El movimiento aporta un poco más de personalidad sin romper el lenguaje visual.</p>
<p><strong>Liebre:</strong> El punto de entrada, opción balanceada y ligera para proyectos que están arrancando, con minería y compute accesibles.</p>
<p><strong>Puma:</strong> Un tier avanzado, para usuarios que necesitan configurar en detalle.</p>
<p>**Cóndor:**El paquete enterprise, moldeado por conversación directa y customizado a necesidades específicas en escala.</p>
<p><video src="/posts/diseño/cruzar/servicios.mp4" poster="/posts/diseño/cruzar/servicios-poster.jpg" width="488" height="140" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Paquetes"></video></p>
