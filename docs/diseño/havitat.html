        <h1>havitat</h1>
        <div class="meta">25/08/2026 // kaste</div>
      </header>
      
      <div class="nota nota-prosa"><p><em><strong>havitat</strong></em> es mi identidad personal, que sirve un doble propósito: representa mi práctica de diseño, a la vez que enmarca una transmisión estilo radio donde comparto y hablo sobre música mientras trabajo.</p>
<p><img src="/posts/diseño/havitat/profile.webp" width="600" height="188" loading="lazy" alt="Identidad"></p>
<p>La restricción principal era crear algo lo suficientemente neutro para enmarcar proyectos de diseño muy distintos y a la vez flexible e interesante para funcionar a lo largo del stream.</p>
<h3>Inspiraciones</h3>
<p>La contención fue la solución principal. Investigué la evolución de los bumps de Adult Swim de los 2000s buscando una forma de mantener las cosas simples sin que se sintieran vacías.</p>
<p><img src="/posts/diseño/havitat/inspirations.webp" width="600" height="358" loading="lazy" alt="Inspiración"></p>
<p>Los timelapses de lugares ignorados, el texto blanco sobre negro en minúsculas, y la voz casual generaban exactamente el tipo de atmósfera que buscaba.</p>
<h3>Conectividad</h3>
<p>Quería que la radio expresara ese mismo sentimiento, comunicando algo desde la tranquilidad y la sutileza. El concepto central es la conexión, ya que está en el corazón de lo que significa estar en línea y transmitir.</p>
<p><img src="/posts/diseño/havitat/thumb.webp" width="600" height="338" loading="lazy" alt="Miniatura"></p>
<p>Eso me llevó a explorar la infraestructura como sujeto principal: cables, postes, antenas, caminos y puentes. Partes ordinarias del mundo que es fácil pasar por alto, pero también ejemplos físicos de conexión.</p>
<h3>Filtrado</h3>
<p>La conectividad me dio la materia prima. Sumé un set de filtros de blending y texturas como forma contenida de procesar distintos assets. Aplicados en conjunto, le dan al resultado un aspecto compartido.</p>
<p><img src="/posts/diseño/havitat/bump.webp" width="600" height="338" loading="lazy" alt="Bump"></p>
<p>Un workflow dedicado me permite aplicar rápidamente esos filtros a nuevos assets, para generar imágenes y videos en el mismo tono cuando hace falta.</p>
<h3>Voz</h3>
<p>Las minúsculas son parte de la comunicación de <em>havitat</em>. Permiten que la identidad se sienta familiar y directa, más cerca de un mensaje o una nota que de una comunicación de marca formal.</p>
<p><img src="/posts/diseño/havitat/wordmarks.webp" width="600" height="204" loading="lazy" alt="Iconografía"></p>
<p>Ese tono mantiene la práctica de diseño personal y el stream relajado, haciendo que el canal se sienta como una invitación a pasar tiempo en un espacio compartido, no como un broadcast de un host central.</p>
<h3>Stream</h3>
<p>El stream funciona más como una pequeña estación de radio en internet que como un livestream convencional. La música le da a los que se suman algo que compartir mientras trabajan en sus cosas, charlando y acompañándose mutuamente.</p>
<p><img src="/posts/diseño/havitat/channel.webp" width="600" height="221" loading="lazy" alt="Canal"></p>
