<img src="/posts/diseño/dinamik/bot.webp" width="600" height="37" loading="lazy" alt="presentación del logo"><div class="nota nota-prosa"><p><em><strong>DINAMIK</strong></em> es un estudio de desarrollo boutique enfocado en construir sistemas precisos de interacción humano-computadora e interfaces con atención extrema al detalle. Necesitaban una identidad que pudiera crecer con ellos mientras exploraban nuevos proyectos.</p>
<p>El sistema visual debía reflejar esa misma disciplina: técnico, preciso, enfocado, sin volverse frío. Construí el lenguaje visual alrededor del (increíble) mundo de la óptica, las grillas de calibración, retículas e interfaces responsivas.</p>
<p><img src="/posts/diseño/dinamik/optics-inspiration.webp" width="600" height="356" loading="lazy" alt="Óptica"></p>
<h3>Óptica</h3>
<p><em>DINAMIK</em> construye sistemas para que sean usados por personas, así que la identidad debía sentirse viva. El motion aporta presencia y calidez a assets que de otro modo quedarían estériles, haciendo que el sistema visual se sienta más cerca de una interfaz que de un brand toolkit estático.</p>
<p><video src="/posts/diseño/dinamik/tagline.mp4" poster="/posts/diseño/dinamik/tagline-poster.jpg" width="700" height="124" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Tagline"></video></p>
<p>El tagline <em>VOLVETE DINÁMICO</em> fue una frase que el equipo usó para explicar su foco: adaptabilidad a través de workflows multi-dominio. Su fundamento es aplicar una mentalidad UNIX para crear herramientas pequeñas, interconectadas, con feel táctil, que hacen una cosa bien y componen con el resto.</p>
<h3>Herramientas</h3>
<p>Como el estudio crea distintas herramientas, cada una necesita una identidad derivada del mismo lenguaje visual. <em><strong>Retícula</strong></em>, su primera herramienta, fue renombrada tras aprobarse el concepto visual. Es una interfaz radial para disparar macros sin usar el teclado.</p>
<p><video src="/posts/diseño/dinamik/footer.mp4" poster="/posts/diseño/dinamik/footer-poster.jpg" width="700" height="124" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Retícula"></video></p>
<p><em>Retícula</em> se diferencia por su forma radial, así que cada parte de la retícula se construyó desde cero. El sistema lleva la precisión de <em>DINAMIK</em> a la interfaz permitiendo motion y animación totalmente customizables.</p>
