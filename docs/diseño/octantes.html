        <h1>octantes</h1>
        <div class="meta">12/09/2026 // kaste</div>
      </header>
      
      <div class="nota nota-prosa"><p><em><strong>octantes</strong></em> es mi página personal, que une diseño, desarrollo, escritura, música, juegos y experimentos. Quería que el sitio mismo se volviera una razón para hacer cosas, con sistemas que pudieran crecer alrededor de los proyectos.</p>
<p><img src="/posts/diseño/octantes/icon.webp" width="600" height="570" loading="lazy" alt="Ícono"></p>
<p>El desafío fue construir una plataforma lo bastante amplia para sostener formatos distintos sin achatarlos ni volver la navegación un lío. Tenía que mantenerse abierta a nuevas ideas mientras se volvía mi foco principal.</p>
<h3>Inspiraciones</h3>
<p>Siempre me interesó la estética de la web de los 2000s, especialmente la época de Flash y GeoCities. Kaliber10k fue una influencia grande: cada actualización se trataba como un zine, y la página entera se reconstruía alrededor del lanzamiento. Quería que <em>octantes</em> tuviera algo de esa libertad.</p>
<p><img src="/posts/diseño/octantes/inspirations.webp" width="600" height="715" loading="lazy" alt="Tablero"></p>
<p>La pregunta central era: ¿cómo sería ese estilo con una arquitectura web y UX modernas? Elegí armar una SPA por la experiencia de navegación, pero cargar contenido nuevo puede ser un poco abrupto. Necesitaba una forma de hacer que esas transiciones se sintieran pulidas.</p>
<h3>Portal</h3>
<p>El shader de portal es la respuesta a ese problema. Es un sistema de animación construido a mano en vanilla JS y manejado por una state machine, con animaciones específicas para revelar contenido según la ruta que seguimos.</p>
<p><video src="/posts/diseño/octantes/portal.mp4" poster="/posts/diseño/octantes/portal-poster.jpg" width="800" height="450" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Portal"></video></p>
<p>Le aporta peso al acto de cargar, haciendo que se sienta como un motor físico. La navegación se pausa mientras corren las animaciones, como en la interfaz de Hearthstone.</p>
<p>Junto al shader hay una galería de cards con los posts reales. Seleccionar una dispara una transición y cambia el contenido debajo del portal. El resultado es que nunca ves realmente cómo cambia el contenido.</p>
<h3>Portfolio</h3>
<p>También necesitaba un punto de entrada directo para mi trabajo de diseño y desarrollo. Los proyectos se muestran en una interfaz radial, donde se puede seleccionar cada uno para ver sus detalles antes de abrirlo en el portal principal.</p>
<p><video src="/posts/diseño/octantes/radial.mp4" poster="/posts/diseño/octantes/radial-poster.jpg" width="800" height="450" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Portfolio"></video></p>
<p>El layout usa un sistema custom de slots calculados, shifts y ángulos que crece con el contenido sin requerir cambios de código. Esto mantiene el posicionamiento y permite que sea barato de renderizar.</p>
<h3>havitat y vitacora</h3>
<p><em>havitat</em> es una serie de habitaciones dibujadas a mano, que suman una forma alternativa de navegar por el sitio. Cada habitación contiene interfaces funcionales en el mismo estilo, renderizadas en tiempo real mientras exploras.</p>
<p><video src="/posts/diseño/octantes/havitat.mp4" poster="/posts/diseño/octantes/havitat-poster.jpg" width="800" height="450" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="havitat"></video></p>
<p>El sistema implementa una definición de pincel propia con animaciones line boil estilo Flash, y mantiene todo liviano al usar SVG en vez de canvas o WebGL.</p>
<p>El mismo lenguaje dibujado se extiende a <em>vitacora</em>, un log visual continuo para pizarras de estudio y updates chicos que no encajan como posts separados. Las entradas se van sumando a un feed único continuo y se animan al scrollear, dejando que el log crezca en el tiempo.</p>
<h3>Archivo</h3>
<p>Cada vez que se sube contenido nuevo, el sitio autogenera una versión de archivo de sí mismo. Cada página queda alcanzable a través de versiones HTML estilo GeoCities, servidas automáticamente a usuarios sin JS.</p>
<p><video src="/posts/diseño/octantes/archive.mp4" poster="/posts/diseño/octantes/archive-poster.jpg" width="920" height="948" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Archivo"></video></p>
<p>Al sacar el portal, shaders y capas interactivas, el archivo mantiene la página completamente accesible sin importar hardware ni navegador.</p>
