        <h1>nubenueve - tienda de discos</h1>
        <div class="meta">20/06/2026 // kaste</div>

      <div class="nota nota-verso"><p><em>Podés visitar la página entrando al link: <a href="https://inercia-ar.github.io/front-nubenueve/" target="_blank" rel="noopener noreferrer">nubenueve</a></em></p>
<p><video src="/posts/diseño/nubenueve/1.mp4" poster="/posts/diseño/nubenueve/1-poster.jpg" width="800" height="408" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="1"></video><br /><video src="/posts/diseño/nubenueve/2.mp4" poster="/posts/diseño/nubenueve/2-poster.jpg" width="800" height="408" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="2"></video><br /><video src="/posts/diseño/nubenueve/3.mp4" poster="/posts/diseño/nubenueve/3-poster.jpg" width="800" height="408" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="3"></video></p>
<p>nubenueve fue mi primer proyecto de diseño <em>funcional</em> para el portfolio<br />después de tantas marcas ficticias, buscaba algo real, en producción y vivo</p>
<p>la idea era construir una tienda virtual de discos con identidad <em>propia</em><br />creé cuatro artistas ficticios, diseñando discos con portadas para cada uno</p>
<p>exploré fondos animados, textura visual y transiciones en la interfaz<br />el sistema incluye un <strong>carrito</strong> y un visualizador de portadas interactivo<br />el frontend funciona por su cuenta pero puede acoplarse a un backend<br />el diseño usa una paleta cálida, inspirada en la estética de los casettes tdk</p>
<p>proyecto desarrollado con vue, css vanilla y figma para el diseño de ui<br />inspirado por el gran disco de dano, <a href="https://www.youtube.com/watch?v=s7aTWLNHCzw" target="_blank" rel="noopener noreferrer">el hombre hace planes, dios se rie</a></p>
</div>
