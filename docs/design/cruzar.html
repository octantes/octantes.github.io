        <h1>cruzar</h1>
        <div class="meta">19/09/2024 // kaste</div>
      </header>
      
      <video src="/posts/diseño/cruzar/banner.mp4" poster="/posts/diseño/cruzar/banner-poster.jpg" width="488" height="274" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="project header"></video>
<video src="/posts/diseño/cruzar/fundamentos.mp4" poster="/posts/diseño/cruzar/fundamentos-poster.jpg" width="488" height="174" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="brand fundamentals"></video>
<video src="/posts/diseño/cruzar/topografico.mp4" poster="/posts/diseño/cruzar/topografico-poster.jpg" width="488" height="140" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="terrain and topography"></video>
<video src="/posts/diseño/cruzar/servicios.mp4" poster="/posts/diseño/cruzar/servicios-poster.jpg" width="488" height="140" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="service packages"></video>
<video src="/posts/diseño/cruzar/footer.mp4" poster="/posts/diseño/cruzar/footer-poster.jpg" width="488" height="294" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="presentation footer"></video><div class="nota nota-prosa"><p><em><strong>CRUZAR</strong></em> is a project building two data centers in the Patagonian mountain range, designed to support AI training, accessible high-performance compute, and Bitcoin mining infrastructure.</p>
<p>The identity had to connect the physical scale of the landscape with the machinery inside it: mountain ranges, satellite terrain imagery, server racks, cables and the constant movement of data. It needed to feel rooted in Argentina while speaking the native language of contemporary infrastructure.</p>
<p><img src="/posts/diseño/cruzar/process-board.webp" width="600" height="310" loading="lazy" alt="Board"></p>
<p>Beyond the facilities themselves, <em>CRUZAR</em> is built around a wider idea of computing sovereignty. The project aims to give younger builders access to local compute for their own work, encourage technical experimentation in Argentina, and compound value by reinvesting proceeds back into the infrastructure used for mining and storing Bitcoin.</p>
<h3>Sketches</h3>
<p>The starting point wasn't a blank canvas in this case. An unused sketch for a clothing brand already contained several of the raw components <em>CRUZAR</em> needed: terrain, texture, and a graphic language with enough movement to become a system.</p>
<p><img src="/posts/diseño/cruzar/previous-sketches.webp" width="600" height="338" loading="lazy" alt="Sketches"></p>
<p>The work became an exercise in selection. I repurposed the elements that could carry the new project, stripped back the ones tied too closely to the original direction, and introduced new tools to connect the identity to data infrastructure.</p>
<h3>The Map</h3>
<p>Satellite imagery needed to be a living part of <em>CRUZAR's</em> visual identity, not a fixed background asset. I built a custom system connected to the Google Earth API that automatically exports new, processed animations ready to use across the project.</p>
<p><video src="/posts/diseño/cruzar/topografico.mp4" poster="/posts/diseño/cruzar/topografico-poster.jpg" width="488" height="140" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Asset"></video></p>
<p>The export system runs on a local-first server with custom tooling. It supports location updates based on coordinates and automatically generates identity cards that can be exported as static assets or ready-to-use animations.</p>
<p><video src="/posts/diseño/cruzar/ge-system.mp4" poster="/posts/diseño/cruzar/ge-system-poster.jpg" width="800" height="450" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Google Earth"></video></p>
<h3>Packages</h3>
<p><em>CRUZAR</em> needed distinct paths for different kinds of builders, from a first compute or mining setup to fully configured infrastructure. Each package needed enough visual separation to be understood at a glance, while still belonging to the same identity system.</p>
<p>I based the tiers on native animals, turning each one into a rotating 3D object with the feel of a videogame item. The motion gives every package its own presence without breaking from the wider visual language.</p>
<p><strong>Liebre:</strong> is the entry point: a balanced and lightweight option for early projects, with accessible cost-efficient mining and compute capacity.</p>
<p><strong>Puma:</strong> is a more advanced tier, built for users who need to configure the setup in greater detail.</p>
<p><strong>Cóndor:</strong> is the enterprise package, shaped through direct conversation and customized around specific infrastructure needs.</p>
<p><video src="/posts/diseño/cruzar/servicios.mp4" poster="/posts/diseño/cruzar/servicios-poster.jpg" width="488" height="140" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Packages"></video></p>
