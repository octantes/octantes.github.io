<p>in this case, the concept completely took over the project, I think for the better<br />placing a <strong>datacenter</strong> in the mountain range is a latent idea in our imagination<br />the crypto leg is part of the same goal — making good use of our environment<br />I feel it's only a matter of time, and hopefully it will be an <em>argentine</em> project</p>
