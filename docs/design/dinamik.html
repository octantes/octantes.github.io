<img src="/posts/diseño/dinamik/bot.webp" width="600" height="37" loading="lazy" alt="brand logo presentation"><div class="nota nota-prosa"><p><em><strong>DINAMIK</strong></em> is a boutique development studio focused on building precise human-computer interaction systems and UI with extreme attention to detail. They needed an identity that could grow with them as they explored new projects.</p>
<p>The visual system needed to reflect that same discipline: technical, precise, and focused without becoming cold. I built the visual language around the fascinating world of optics, calibration grids, reticles, and responsive interfaces.</p>
<p><img src="/posts/diseño/dinamik/optics-inspiration.webp" width="600" height="356" loading="lazy" alt="Optics"></p>
<h3>Optics</h3>
<p><em>DINAMIK</em> builds systems meant to be used by people, so the identity needed to feel active in the same way. Motion brings presence and warmth to assets that would otherwise remain sterile, making the visual system feel closer to an interface than a fixed brand toolkit.</p>
<p><video src="/posts/diseño/dinamik/tagline.mp4" poster="/posts/diseño/dinamik/tagline-poster.jpg" width="700" height="124" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Tagline"></video></p>
<p>The <em>Become DINAMIK</em> tagline was a long-running phrase the team used to explain their focus: adaptability through multi-domain workflows. They apply a UNIX mindset to create small, interconnected, tactile-feeling tools that do one thing well and compose with the rest.</p>
<h3>Tools</h3>
<p>Because the studio creates different tools, each needs an identity derived from the same visual language. <em><strong>Reticula</strong></em>, their first tool, was renamed after the visual concept was approved. It is a radial interface for triggering key macros.</p>
<p><video src="/posts/diseño/dinamik/footer.mp4" poster="/posts/diseño/dinamik/footer-poster.jpg" width="700" height="124" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Reticula"></video></p>
<p><em>Reticula</em> is differentiated by its radial form, so every part of the reticle was built from the ground up. The system carries <em>DINAMIK's</em> precision into the interface while allowing for fully customizable motion and animation.</p>
