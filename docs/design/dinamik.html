<p>dinamik was my <em>third</em> design project on fictional brand identities</p>
<p>in this case, the idea was to build something <strong>responsive</strong> that adapts to the screen<br />I thought of the branding so it could be revisited in future projects<br />the result is a studio that builds tools to improve productivity<br />the aesthetic draws from <em>optics</em>, which surprisingly has a lot of appeal</p>
<p>the project was done using figma, photoshop and after effects, among others</p>
<p>inspired by the work of <a href="https://www.behance.net/bn_digital">bn digital</a>, which I find excellent and unattainable</p>
