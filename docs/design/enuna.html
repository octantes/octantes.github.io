<img src="/posts/diseño/enuna/credits.webp" width="600" height="235" loading="lazy" alt="project credits"><div class="nota nota-prosa"><p><em><strong>en una</strong></em> is a digital magazine shaped by street culture and the internet.</p>
<p>As the publication moved from indie-fanzine editions into a multimedia platform, it needed an identity that could carry both worlds without sanding down either one.</p>
<p><img src="/posts/diseño/enuna/process-board.webp" width="600" height="335" loading="lazy" alt="Board"></p>
<p>I built a visual system around recognizable, flexible elements that could shift across the website, editorial content, motion, and social media posts. Each piece needed to hold together as an identity while leaving room for play, mutation, and new formats.</p>
<p>The work steps away from traditional media aesthetics and keeps the rougher, self-made energy of the original publication alive. Typography, texture, composition, and motion work together to make the system feel active rather than fixed.</p>
<h3>Website</h3>
<p>As the team found its voice online, the website needed to behave like a whiteboard: a place to test ideas, shift direction, and keep evolving without rebuilding the whole system each time.</p>
<p>Vertical video was becoming central to the magazine's output, so the site had to make that format feel native rather than bolted on. We built a flexible editorial system that brings YouTube's vertical embeds into the page, where they play on hover and sit alongside the magazine's written and visual work.</p>
<p>The result ties the platform and its social-first output into one continuous experience.</p>
<p><img src="/posts/diseño/enuna/webpage.webp" width="600" height="1157" loading="lazy" alt="Website"></p>
