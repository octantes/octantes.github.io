<p>this was my first <em>design</em> project, after years of not diving too deep<br />I came up with fictional brand concepts as an excuse to practice</p>
<p>in this case, the goal was to design assets and <strong>animate</strong> them using after effects<br />for that, the excuse was a digital publication magazine with very few colors<br />today I see spacing issues, and the copy text feels basic to me<br />I'd like to revisit this <em>aesthetic</em> with a real project that makes use of it</p>
<p>the work was done using figma, photoshop and after effects, among others</p>
<p>inspired by <a href="https://cultdeadcow.com/about/">cdc comms</a>, adult swim <a href="https://youtube.com/playlist?list=PL075thqiB6t9FE4pyy-2omH_rZMVhnp77&amp;si=JR1lDU6VWQ2jujj9">bumps</a> and dedsec <a href="https://www.behance.net/gallery/47393655/Watch_Dogs-2-DEDSEC-Video">animations</a></p>
