<p><em>You can visit the page <a href="https://inercia-ar.github.io/front-nubenueve/" target="_blank" rel="noopener noreferrer">here!</a></em></p>
<hr>
<p><em><strong>nubenueve</strong></em> is a niche record label and digital storefront built around the physical experience of music: vinyl, cassette, CDs and the artwork that makes each release feel collectible and memorable.</p>
<p>Since the catalogue already carries the character, the brand identity and website needed a restrained visual language that introduced warmth and made browsing feel like flipping through a record collection.</p>
<h3>Album Art</h3>
<p>The album covers needed to work as individual releases, each carrying the artist's concept, while still reading as part of one catalogue. They all explore a different visual direction, but shared internal references and layout keep the collection connected.</p>
<p><img src="/posts/diseño/nubenueve/album-art.webp" width="600" height="453" loading="lazy" alt="Album Art"></p>
<h3>The Page</h3>
<p>The website gives the catalogue room to be discovered through the covers first, with physical formats and release information following naturally in a slow-tempo to give each artwork time to be experienced.</p>
<p>The homepage has a presentation system that animates with the art from every release, built to grow over time as more artists and records are added in.</p>
