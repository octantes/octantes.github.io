<p>around 2021 I started having an immense number of shelved tracks</p>
<p>I thought of putting together a project where every track lasts <em>one minute</em><br />to make use of all those loops that otherwise would never see the light</p>
<p>the <strong>video and title</strong> came together as I was structuring the ep</p>
<p>it ended up working as a quick excuse to practice some mixing<br />the number of archived tracks didn't decrease at all, I'd have to reiterate</p>
