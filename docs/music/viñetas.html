      <header class="post-header">
        <h1>viñetas</h1>
        <div class="meta">22/12/2024 // kaste</div>
      </header>
      
      <p><iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/PzVjHnEJX0w?rel=0" title="YouTube Video" frameborder="0" allow="clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen class="YTVideo"> </iframe></p>
<p>ideas don't belong to us<br />they are <em>the fruit of a collective substrate</em>: our time and the references we take<br />with that in mind, not sharing their outcome is an act of individualism<br />it's not giving back to the world what it gave us<br />perfectionism is <strong>selfish</strong> above all else</p>
<p>with the intention of paying tribute to my ideas, of being &quot;worthy of them&quot;, I got lost<br />the path of art is one of healing<br />but the cycle doesn't complete until we call the work finished<br /><em>it doesn't end until we share it</em> so we can start again<br />transformed by the process</p>
<p>perfectionism is a mirror that inverts our purpose:<br /><strong>leading others</strong> along that path<br />by not sharing, the change stays mental<br />we carry it inside without it expressing outward</p>
<p>viñetas is one of those projects that had been fermenting on my hard drive since 2020<br />I abandoned it hoping to improve the mix another time and moved on to the next<br />I got distracted and forgot it, but <em>you can only connect the dots looking backwards</em></p>
<p>today I choose to upload it as it was saved, to pick up that path again<br />time to become a channel for those ideas again and the first step is <strong>accepting</strong> them as they are<br />it's up to you to see if there's something there and complete the cycle</p>
<p>more soon, as dano says<br /><strong>always things</strong></p>
