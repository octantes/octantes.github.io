      <p><iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/Ud0ZK6ZfOqk?rel=0" title="YouTube Video" frameborder="0" allow="clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen class="YTVideo"> </iframe></p>
<p>what do you want to <em>change</em>? shall we read the cards?</p>
<p>this album went through <strong>many iterations</strong> that I still have saved<br />some of them even had finished lyrics, but the vocals didn't click</p>
<p>I ended up deciding to release it as instrumentals to move on to the next album</p>
<p>the beats were based on the idea of processing guitars as if they were synths<br />the video is a <em>weird experiment</em>; as always, an excuse to mess around</p>
