      <header class="post-header">
        <h1>trackwithslate</h1>
        <div class="meta">23/06/2025 // kaste</div>
      </header>
      
      <p><em>You can find the project repo in my <a href="https://github.com/octantes/trackwithslate" target="_blank" rel="noopener noreferrer">Github</a></em></p>
<p>slate es una webapp local para <strong>crear, organizar y exportar data tabular</strong> en el browser<br />no necesita instalación ni internet: solo descargá el HTML y abrilo con el navegador</p>
<p>armado para tener una forma local y liviana de gestionar data sin dependencias<br />ideal para quienes buscan simpleza y privacidad: no pensada para uso profesional<br />sin embargo, se cubren algunos edge-cases importantes para asegurar practicidad</p>
<p>toda la información se mantiene en tu máquina, sin cuentas, servidores o syncs<br />la data <em>queda en tu browser hasta que la exportás</em> - hacé backups regularmente</p>
<p><img src="/posts/desarrollo/trackwithslate/screenshot.webp" width="600" height="338" loading="lazy" alt="screenshot"></p>
<p>cada release es estable, el objetivo es mantenerlo <strong>simple</strong>: abrilo y programá</p>
<p><em>importar/exportar</em>: traé y guardá tu información en CSV, un formato plain text<br /><em>editar registros</em>: visualizá, modificá y ordená la tabla con bulk-delete y fuzzy-find<br /><em>autocompletado de categorías</em>: creá botones para llenar entradas rápidamente<br /><em>formatos de fecha</em>: autocompleta con la fecha actual en el formato que quieras<br /><em>almacenamiento</em>: todo se guarda dentro del browser cache usando localstorage<br /><em>tipos de datos</em>: definí columnas con restricciones para tipos de datos específicos<br /><em>superligero</em>: compatible con cualquier navegador, incluyendo móvil; solo ~100 KB</p>
<p><strong>wip</strong>: campos con subdivisiones simbólicas &gt; dataviz &gt; múltiples databases</p>
<p>pro-tip: <em>guardalo como favorito para acceder rápidamente</em></p>
