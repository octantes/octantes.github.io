      <header class="post-header">
        <h1>arch-hud</h1>
        <div class="meta">14/09/2025 // kaste</div>
      </header>
      
      <p><em>You can find the project repo in my <a href="https://github.com/octantes/arch-hud" target="_blank" rel="noopener noreferrer">Github</a></em></p>
<p>arch-hud es una build personal de herramientas <a href="https://suckless.org/" target="_blank" rel="noopener noreferrer">suckless</a> para uso diario en arch</p>
<p>las herramientas fueron implementadas pensando en armar un <em>heads up display</em><br />buscando que la pc vuelva a ser una herramienta y no un agujero negro cognitivo<br />se implementaron varios parches sobre DWM junto a una estética de estilo retro<br />sin gaps, transparencia ni compositor por defecto; <strong>sin distracciones innecesarias</strong></p>
<p><img src="/posts/desarrollo/arch-hud/screenshot.webp" width="600" height="338" loading="lazy" alt="screenshot"></p>
<p>para compilar, entrá en cada dir y ejecutá <em>sudo make clean install</em> o usa build.sh</p>
<p><a href="https://dwm.suckless.org/" target="_blank" rel="noopener noreferrer">dwm</a> - tiling windows manager<br /><a href="https://tools.suckless.org/dmenu/" target="_blank" rel="noopener noreferrer">dmenu</a> - menú de scripts dinámico<br /><a href="https://st.suckless.org/" target="_blank" rel="noopener noreferrer">st</a> - emulador de terminal simple<br /><a href="https://surf.suckless.org/" target="_blank" rel="noopener noreferrer">surf</a> - navegador muy minimalista<br /><a href="https://tools.suckless.org/tabbed/" target="_blank" rel="noopener noreferrer">tabbed</a> - ventanas para st y surf<br /><a href="https://github.com/dunst-project/dunst" target="_blank" rel="noopener noreferrer">dunst</a> - daemon de notificaciones</p>
<p>podés sumar el compositor <a href="https://github.com/yshui/picom" target="_blank" rel="noopener noreferrer">picom</a> si experimentás screen tearing o glitches</p>
