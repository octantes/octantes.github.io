        <h1>scav - substrato para una web portable</h1>
        <div class="meta">15/09/2026 // kaste</div>
      </header>
      
      <div class="nota-prosa"><hr>
<p><em>Podés encontrar el repositorio del proyecto en mi <a href="https://github.com/octantes/scavenger" target="_blank" rel="noopener noreferrer">Github</a></em></p>
<hr>
<pre><code>&gt; Cosechá cualquier cosa de la web y conectala en algo nuevo
&gt; Exportalo como archivo html, usalo en cualquier lugar y publicalo
&gt; La UI es una función del estado, y el estado es una función del DOM
</code></pre>
<p><video src="/posts/desarrollo/scavenger/loop.mp4" poster="/posts/desarrollo/scavenger/loop-poster.jpg" width="720" height="404" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="loop"></video></p>
<p><strong>scavenger es un substrato para herramientas web portables.</strong> Cualquier cosa que construyas con scav se vuelve portable por definición, exportándose a un único archivo HTML independiente que funciona en cualquier lugar.</p>
<p>Sin paquetes, sin pasos de compilación, sin frameworks, sin cuentas, y <em>sin llamar a casa</em> a menos que lo quieras explícitamente.</p>
<p>El kit de herramientas tiene cuatro primitivas principales, deliberadamente diferentes en su forma porque cada una tiene la forma natural para lo que hace. <strong>No necesitás todas para construir algo</strong>, pero juntas forman el proyecto completo.</p>
<h3>Las Cuatro Herramientas</h3>
<p><a href="https://github.com/octantes/scavenger/blob/main/docs/kernel.md" target="_blank" rel="noopener noreferrer">kernel</a></p>
<p>El script que ejecutás en cualquier sitio web para cosechar componentes, extraer datos y ejecutar herramientas de debugging visual o interactuar con cualquier página.</p>
<p><video src="/posts/desarrollo/scavenger/harvest.mp4" poster="/posts/desarrollo/scavenger/harvest-poster.jpg" width="720" height="404" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="harvest"></video></p>
<p>Cosechar no es scrapear HTML o sacar una captura de pantalla. Consiste en <strong>tomar un componente renderizado de una página en vivo y reconstruirlo</strong> como un Web Component independiente: resolviendo los estilos que el navegador realmente aplicó, preservando la cascada, unidades responsivas, variables, pseudo-elementos, fuentes, recursos, estado de los formularios y el comportamiento de diseño relevante.</p>
<p><a href="https://github.com/octantes/scavenger/blob/main/docs/patchbay.md" target="_blank" rel="noopener noreferrer">patchbay</a></p>
<p>El entorno de ejecución, donde colocás componentes y los conectás, exportando el proyecto como está a HTML.</p>
<p><video src="/posts/desarrollo/scavenger/wiring.mp4" poster="/posts/desarrollo/scavenger/wiring-poster.jpg" width="720" height="404" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="wiring"></video></p>
<p><a href="https://github.com/octantes/scavenger/blob/main/docs/quests.md" target="_blank" rel="noopener noreferrer">quests</a></p>
<p>El puente hacia los datos externos en vivo, convirtiendo selectores CSS en canales para que patchbay los consuma como valores o componentes de una página que se actualizan en vivo.</p>
<p><video src="/posts/desarrollo/scavenger/quests.mp4" poster="/posts/desarrollo/scavenger/quests-poster.jpg" width="720" height="404" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="quests"></video></p>
<p><a href="https://github.com/octantes/scavenger/blob/main/docs/compiler.md" target="_blank" rel="noopener noreferrer">compiler</a></p>
<p>El entorno de creación, donde creás nuevos nodos lógicos y componentes que extienden patchbay.</p>
<p><video src="/posts/desarrollo/scavenger/component.mp4" poster="/posts/desarrollo/scavenger/component-poster.jpg" width="720" height="404" class="gifvideo" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="component"></video></p>
<h2>Filosofía</h2>
<p>Este proyecto parte de una premisa simple: <strong>el navegador ya es un substrato computacional maleable.</strong></p>
<p>El Modelo de Objetos del Documento (DOM) no es solo la representación de una interfaz; es un espacio de estado en vivo y direccionable que el navegador sabe cómo renderizar, mutar, serializar, persistir y rehidratar. Esto lleva a un modelo simple: la interfaz de usuario (UI) es una función del estado, y todo <strong>estado persistente es una función del DOM.</strong></p>
<pre><code>htmx dice
&quot;no mantengas una segunda representación de la UI del lado del cliente
el HTML es la representación&quot;

scav dice
&quot;no mantengas una segunda representación de la aplicación
el DOM contiene el estado&quot;
</code></pre>
<p>La consecuencia de esta conceptualización es que <strong>el documento no es una representación de la aplicación, la aplicación es una rehidratación del documento.</strong> Si el estado vive en los atributos de los elementos, los valores pueden ser serializados en el markup, y si el entorno de ejecución lee el documento en sí, no hay un modelo oculto que pueda desincronizarse. Guardar es un volcado de memoria, el archivo simplemente bootea.</p>
<p>La misma propiedad que hace posible la serialización del estado también hace que la web en tiempo de ejecución sea <strong>un material a partir del cual podés construir</strong>. La web primitiva en sí misma fue construida alrededor de documentos que podían ser enlazados, copiados, guardados, editados y servidos sin pedir permiso a una plataforma.</p>
<p>Esto sigue siendo cierto. El modelo subyacente no ha cambiado, pero <em>las capas de herramientas y la complejidad creciente lo han oscurecido.</em> Dejamos de notarlo - scav hace que esas propiedades sean evidentes y directamente utilizables. Lo que se distribuye a tu máquina es tuyo para cosechar, reconectar y reutilizar, y lo que construyas con ello puede persistir como un documento.</p>
<p>El navegador moderno es la aproximación funcional más cercana al modelo conceptual que el Memex imaginó, que Engelbart demostró, y sobre el que Nelson pasó toda una vida escribiendo: hipertexto del que sos autor, no solo consumidor. scavenger es menos una invención y más la comprensión de que el modelo <strong>ya está acá</strong>, instalado en casi todas las computadoras personales.</p>
<p>El argumento largo vive en un ensayo complementario - <em>Artesanías del Runtime</em> - sobre el navegador como un entorno de ejecución cosechable y <strong>el tercer dominio</strong> de herramientas que solo existen ahí: no son CLI, ni aplicaciones web, sino un entorno de ejecución visual prioritariamente local (local-first visual runtime). (Próximamente.)</p>
