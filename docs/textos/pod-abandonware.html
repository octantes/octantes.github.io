      <header class="post-header">
        <h1>abandonware - la permanencia del autor</h1>
        <div class="meta">31/03/2022 // kaste</div>
      </header>
      
      <div class="nota-prosa"><p><em>Esta nota fue originalmente escrita para y publicada en <a href="https://pressover.news/opinion/abandonware-la-permanencia-del-autor/" target="_blank" rel="noopener noreferrer">Press Over</a></em></p>
<p>A medida que las artes maduran, surgen problemas que complejizan la conservación de ciertas obras. Todas las disciplinas sufren en mayor o menor medida el paso del tiempo, pero <em>cuando el arte está estrechamente ligado al continuo avance de la tecnología, como en nuestra industria, esas dificultades se intensifican</em>. Existen especialistas en la restauración de pinturas. El cine ha encontrado las mejores formas de almacenar celuloides y vemos edificios en reparación constantemente, pero mientras tanto, muchos juegos están desapareciendo. Hablemos del abandonware.</p>
<p><img src="/posts/textos/pod-abandonware/abandonware-1.webp" width="600" height="338" loading="lazy" alt="Descomposición de datos (o data rot) en CD"></p>
<h3>¿Abandonware? ¿Qué es?</h3>
<p>Cuando hablamos de abandonware, solemos pensar en consolas antiguas y monitores de tubo, pero en realidad, el término hace referencia al <strong>abandono de cualquier tipo de software por parte de sus desarrolladores o proveedores</strong>. Al ocurrir, los usuarios pueden perder el soporte técnico, la posibilidad de comprar, descargar o incluso utilizar el producto y a veces, la compatibilidad con nuevos sistemas operativos o hardware.</p>
<h3>¿Por qué sucede?</h3>
<p>Si bien esta etapa suele darse junto con el fin del ciclo de vida del programa, también puede desencadenarse a partir del quiebre de una empresa, o su salida del mercado, en cuyo caso <em>la propiedad intelectual puede quedar en un limbo legal del cual es muy difícil rescatarla</em>, usualmente debido a la falta de documentos legales o la muerte de alguno de los titulares.</p>
<p>Otra posibilidad es que la compañía o el producto sean comprados, en cuyo caso los nuevos propietarios pueden eliminar la disponibilidad del software, e incluso perseguir legalmente los intentos de uso y distribución por parte de los usuarios.</p>
<p><img src="/posts/textos/pod-abandonware/abandonware-2.webp" width="600" height="338" loading="lazy" alt="Una de las grandes leyendas perdidas, muchos archivistas siguen buscando el código del prototipo para Nintendo 64 de Mother 3."></p>
<h3>¿Es importante conservar?</h3>
<p>Todas las aplicaciones que forman parte de nuestra vida cotidiana están en riesgo de ser abandonadas, y con ellas, puede desaparecer nuestra información, nuestro trabajo, y en algunos casos, una parte de nuestra historia. En particular, con los videojuegos no perdemos únicamente nuestro pasado, sino también el de nuestro medio.</p>
<p>Una particularidad del software frente a otras artes es que <strong>su valor histórico no sólo está en el producto final</strong>. El código nos puede enseñar cómo se hizo el título, quiénes estaban detrás de él, y retratar el proceso creativo atravesado. Lamentablemente, muchas empresas no saben esto, o no les importa, deshaciéndose de esta información como si fuera basura.</p>
<h3>¿Cuáles son los obstáculos?</h3>
<p>Una de las amenazas más grandes para la preservación histórica de los fichines es la <em>corrupción de los medios de almacenamiento físicos</em>. En las primeras décadas del gaming, la mayoría de los productos eran distribuidos en floppy disks o en cartuchos. Hoy conocemos los límites de estos formatos, y cómo los distintos factores ambientales a los que están sujetos, como la radiación cósmica y los campos electromagnéticos, pueden afectarlos. La realidad es que su vida útil fuera de un espacio controlado es bastante corta.</p>
<p><img src="/posts/textos/pod-abandonware/abandonware-3.webp" width="600" height="450" loading="lazy" alt="Imaginemos las miles de ideas, prototipos, códigos y joyas que nunca vamos a conocer, olvidadas en depósitos, lentamente desapareciendo."></p>
<p>Esta situación genera una sensación de apuro, porque mientras los archivistas tratan de solucionar problemas legales y contactar a los dueños para hacer copias legales y distribuirlas, estos juegos se están degenerando. Incluso al ser propietario, lograr una versión que sea utilizable en los sistemas actuales requiere mucho trabajo de compatibilización.</p>
<h3>¿Dónde se archiva el abandonware?</h3>
<p>A pesar de todas estas trabas, hay muchas personas <strong>trabajando para conservar, digitalizar y hacer funcionar esta porción de la historia de la mejor manera posible</strong>. Una de las empresas más conocidas en el ámbito es Good Old Games, que se dedica a relanzar legalmente títulos abandonados, pero es importante resaltar el trabajo de las cientos de páginas sin fines de lucro creadas por la comunidad para difundir ROMs, como MyAbandonware.com, OldGamesDownload.com y Archive.org.</p>
<p>Otros sitios se especializan en rescatar el apartado visual, buscando publicidades, posters, revistas y cajas originales, y permitiendo aportes de todos los usuarios, como MobyGames.com, que recopila imágenes de obras actuales, junto a sus créditos, información y crítica, construyendo el archivo desde el presente, mientras se puede.</p>
<p><img src="/posts/textos/pod-abandonware/abandonware-4.webp" width="600" height="322" loading="lazy" alt="Cyberpunk 2077, Elden Ring, y todos los nuevos lanzamientos forman parte del archivo."></p>
<p>Si los poseedores de los derechos deciden demandar a alguno de estos espacios, pueden verse obligados a eliminar varios artículos de su catálogo, o cerrar la página por completo. <em>La línea entre el registro histórico y la piratearía no está precisamente clara</em>, y queda en cada uno decidir qué le parece correcto, pero la realidad es que en muchos casos, no se nos da otra alternativa para conseguirlos legalmente.</p>
<h3>Los Autores</h3>
<p>Cuando la gestión legal de la creación no depende de los autores, sus intereses suelen quedar de lado, sin representación. Entonces, es importante preguntarnos: <strong>¿Cuáles son esos intereses?, ¿por qué hacemos videojuegos?</strong> Después de discutirlo con varios desarrolladores, las conclusiones a las que llegamos fueron estas:</p>
<ul>
<li>Generar lo que sentimos al enamorarnos de un juego.</li>
<li>Asombrar, entusiasmar, sorprender e inspirar al jugador.</li>
<li>Transmitir la pasión por el medio.</li>
<li>Formar o pertenecer a una comunidad.</li>
<li>Crear mundos y personajes con los que empatizar.</li>
<li>Dejar un mensaje a través de la historia.</li>
<li>Participar en una obra que trascienda y marque a muchas personas.</li>
<li>Dejar un registro de nuestro tiempo, lo que pensamos y cómo vivimos.</li>
<li>Porque nos nace, porque es un impulso.</li>
</ul>
<p>Hay tantas respuestas como personas existen en el ámbito, y cada una se sentirá identificada con algunas más que con otras, pero un punto en común es <em>la trascendencia, la idea de dejar una parte nuestra en el mundo</em>, para cuando ya no estemos. La existencia de plataformas de registro histórico nos devuelve esa promesa.</p>
<p>Aunque pensemos que lo que pisa el internet permanece ahí para siempre, hasta los servidores pueden fallar. La única forma de evitar el abandonware y preservar lo que nos importa, sea nuestro trabajo, nuestro arte o nuestra información personal, es empezar hoy.</p>
