      <header class="post-header">
        <h1>las microtransacciones y su futuro</h1>
        <div class="meta">13/12/2021 // kaste</div>
      </header>
      
      <div class="nota-prosa"><p><em>Esta nota fue originalmente escrita para y publicada en <a href="https://pressover.news/articulos/las-microtransacciones-y-su-futuro/" target="_blank" rel="noopener noreferrer">Press Over</a></em></p>
<p>Muchos las evitamos a toda costa, otros las consideran una parte fundamental de su experiencia al jugar. Si bien el debate sobre las microtransacciones está <em>plagado de polémicas</em>, la realidad es que pertenecen a la mayoría de los mundos que habitamos cotidianamente, y como tal, es importante pensarlas de cara al futuro. Para esto, primero debemos definirlas.</p>
<p>Básicamente, las microtransacciones consisten en la <strong>compra de bienes digitales por medio de pagos online</strong>. La oferta es muy amplia y depende del juego, pero podemos separarlos en dos categorías según su función: cosméticos y funcionales.</p>
<h3>Bienes cosméticos</h3>
<p>Dentro de esta categoría se encuentran los elementos que no afectan de manera significativa a la jugabilidad. En la mayoría de los casos, su objetivo es <em>cambiar la estética</em>, ya sea por medio de skins para los personajes o armas, bailes, interacciones, o alteraciones visuales en el mapa.</p>
<p><img src="/posts/textos/pob-microtransacciones/microtransacciones-1.webp" width="600" height="627" loading="lazy" alt="Las skins de fortnite son un buen ejemplo de bien cosmético."></p>
<p>La motivación para adquirir este tipo de efectos varía mucho, pero se suele centrar en <em>el apego emocional del jugador con los personajes y el mundo que plantea cada obra</em>. Aunque están mejor vistos que los funcionales, monetizar un aspecto tan cercano a los sentimientos da lugar en muchos casos al abuso del marketing y la psicología para incentivar a los usuarios a comprar cosas que no quieren.</p>
<h3>Bienes funcionales</h3>
<p>En este apartado conviven los aumentos de experiencia, los personajes o armas que sólo se pueden conseguir pagando, los mapas exclusivos, vidas extra y cualquier tipo de objeto que le dé una ventaja dentro del sistema a los compradores.</p>
<p>Los bienes funcionales suelen ser criticados por la <strong>falta de equidad que generan en la comunidad</strong>, especialmente cuando los beneficios afectan directamente a los enfrentamientos entre jugadores, disminuyendo el valor de la experiencia, el entrenamiento y el conocimiento. La creación de términos como “pay to win” (pagar para ganar) reflejan el desprecio que sienten muchos por la implementación de estas prácticas.</p>
<p>Otros objetos quedan fuera de estas categorías, como las lootboxes, que ofrecen recompensas aleatorias al abrirlas, o los pases de temporada, que permiten desbloquearlas al subir de nivel.</p>
<h3>¿Por qué existen las microtransacciones?</h3>
<p>Detrás de cada título que consumimos, hay un equipo que dedicó su tiempo e inevitablemente, sus recursos económicos para desarrollarlo. Puede sonar obvio, pero hay una tendencia a olvidar que la razón por la cual podemos disfrutar de un medio tan diverso es porque hay un modelo de negocio que <strong>crea puestos de trabajo y motiva inversiones</strong> respondiendo a las demandas de los compradores.</p>
<p><img src="/posts/textos/pob-microtransacciones/microtransacciones-2.webp" width="600" height="377" loading="lazy" alt="Los juegos gratuitos que mas ingresos generaron en 2020. Nótese que prácticamente todos son juegos de celular."></p>
<p>Con tanta pasión de por medio, esta es una forma un poco frívola de entender a la industria, pero al final del día, esos equipos tienen que comer. Dejemos en claro que, a pesar de la necesidad de un sistema económico, nunca debemos dejar de criticar su funcionamiento. <em>La cantidad de fallos, abusos y potenciales amenazas tanto para los desarrolladores como para los consumidores son inexcusables</em>, y la única forma de combatirlos es conversando, debatiendo, y formando nuestra postura.</p>
<h3>El rol de las microtransacciones dentro del mercado</h3>
<p>Dentro del modelo de negocio establecido, las microtransacciones son la columna vertebral sobre la cual subsiste un gran porcentaje de la industria, especialmente cuando hablamos de títulos gratuitos y juegos como servicio. Actualmente, muchas empresas eligen el <em>formato freemium</em> para llegar a más gente y generar más ingresos a largo plazo. En otros casos, se aplica la misma idea a productos pagos, aprovechando una base de jugadores sólida que está dispuesta tanto a comprar el fichín como a pagar por elementos exclusivos.</p>
<p><img src="/posts/textos/pob-microtransacciones/microtransacciones-3.webp" width="600" height="482" loading="lazy" alt="Las ventas de microtransacciones en mobile casi duplican a las de consola."></p>
<p>Recientemente se inició un proceso de regulación legislativa para proteger a los consumidores, disparando estudios que cuestionan la ética de estas prácticas, especialmente cuando el público objetivo es menor de edad. Los resultados demuestran que el uso de <strong>efectos visuales, animaciones y sonidos activan una respuesta a nivel químico en el cerebro muy similar a la de las apuestas</strong>, lo cual las hace adictivas. Varios países ya han regulado o eliminado completamente las microtransacciones, pero aún no existen normativas que lo hagan a nivel mundial.</p>
<h3>El Mercado del Futuro</h3>
<p>Ahora que entendemos las bases, podemos pasar a algo un poco más complejo: preguntarnos hacia dónde se dirige este modelo. Si bien no pretendo hacer futurología, analizar algunos sistemas que vienen creciendo nos permite plantear varias posibilidades.</p>
<p>Una de las últimas tendencias dentro de la monetización de videojuegos viene de la mano de la blockchain, una tecnología que, entre otras cosas, sirve para <em>descentralizar elementos digitales, haciéndolos únicos e irreproducibles</em>. Al ser lanzados al mercado, estos objetos virtuales llamados NFTs (tokens no fungibles) adquieren un valor propio que responde a variables culturales y temporales fuera del control de la empresa o persona responsable de su creación.</p>
<h3>¿Cómo se aplican a las microtransacciones?</h3>
<p>La explosión de los NFTs ha sido fuertemente criticada por su impacto en el medioambiente, pero algunos de los conceptos en los que se basan llevan varios años en el gaming. Por ejemplo, en el mercado de Counter Strike, cada skin es única. <strong>Dos personas pueden comprar el mismo objeto, pero estos van a tener diferencias sutiles</strong>, como marcas de desgaste en lugares aleatorios que pueden elevar o disminuir su valor. La razón por la cual no podemos considerarlos NFTs es porque no funcionan en una blockchain, sino en el mercado centralizado de steam.</p>
<p><img src="/posts/textos/pob-microtransacciones/microtransacciones-4.webp" width="600" height="664" loading="lazy" alt="Aunque acotadas, las herramientas que nos da el mercado del CS:GO no difieren mucho de cualquier otra pagina de inversión."></p>
<p>La mayoría de los criptojuegos que exploran estas opciones las presentan como su principal novedad, pero es esperable que con el paso del tiempo y al ver los resultados de los experimentos actuales, <em>se vayan integrando a productos más diversos</em>.</p>
<p>Si algo aprendimos en estos años es que no falta ingenio para integrar cualquier sistema que genere números, como sucedió con los pases de batalla. Esperemos que, pase lo que pase, las condiciones mejoren para todos, y recordemos que, mientras más informados estemos, más difícil va a ser que nos engañen.</p>
